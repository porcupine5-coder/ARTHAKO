<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arthako Logo with Fluid Gradient</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial Black', sans-serif;
            overflow: hidden;
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            z-index: 1000;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .theme-toggle:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.2);
        }

        body.light-mode .theme-toggle {
            background: rgba(15, 23, 42, 0.05);
            border: 2px solid rgba(15, 23, 42, 0.1);
        }

        body.light-mode .theme-toggle:hover {
            background: rgba(15, 23, 42, 0.1);
        }

        .content {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            pointer-events: none;
        }

        .logo-container {
            cursor: pointer;
            perspective: 1000px;
            pointer-events: all;
            position: relative;
        }

        .logo-text {
            font-size: 120px;
            font-weight: 900;
            letter-spacing: 8px;
            position: relative;
            display: inline-block;
            transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .logo-text span {
            display: inline-block;
            position: relative;
            transition: all 0.4s ease;
        }

        body.dark-mode .logo-text span {
            color: #e8e8e8;
            text-shadow: 
                0 0 20px rgba(59, 130, 246, 0.3),
                0 0 40px rgba(59, 130, 246, 0.1);
        }

        body.light-mode .logo-text span {
            color: #1e293b;
            text-shadow: 
                0 0 20px rgba(59, 130, 246, 0.2),
                0 0 40px rgba(59, 130, 246, 0.1);
        }

        body.dark-mode .logo-container:hover .logo-text span:nth-child(1) {
            transform: translateY(-20px) rotateZ(-10deg);
            color: #60a5fa;
            text-shadow: 0 0 30px rgba(96, 165, 250, 0.8), 0 0 60px rgba(96, 165, 250, 0.4);
        }

        body.dark-mode .logo-container:hover .logo-text span:nth-child(2) {
            transform: translateY(-30px) rotateZ(5deg);
            color: #3b82f6;
            text-shadow: 0 0 30px rgba(59, 130, 246, 0.8), 0 0 60px rgba(59, 130, 246, 0.4);
        }

        body.dark-mode .logo-container:hover .logo-text span:nth-child(3) {
            transform: translateY(-40px) rotateZ(-5deg) scale(1.2);
            color: #2563eb;
            text-shadow: 0 0 40px rgba(37, 99, 235, 1), 0 0 80px rgba(37, 99, 235, 0.5);
        }

        body.dark-mode .logo-container:hover .logo-text span:nth-child(4) {
            transform: translateY(-35px) rotateZ(8deg);
            color: #1d4ed8;
            text-shadow: 0 0 30px rgba(29, 78, 216, 0.8), 0 0 60px rgba(29, 78, 216, 0.4);
        }

        body.dark-mode .logo-container:hover .logo-text span:nth-child(5) {
            transform: translateY(-25px) rotateZ(-8deg);
            color: #3b82f6;
            text-shadow: 0 0 30px rgba(59, 130, 246, 0.8), 0 0 60px rgba(59, 130, 246, 0.4);
        }

        body.dark-mode .logo-container:hover .logo-text span:nth-child(6) {
            transform: translateY(-30px) rotateZ(10deg);
            color: #60a5fa;
            text-shadow: 0 0 30px rgba(96, 165, 250, 0.8), 0 0 60px rgba(96, 165, 250, 0.4);
        }

        body.dark-mode .logo-container:hover .logo-text span:nth-child(7) {
            transform: translateY(-20px) rotateZ(-12deg);
            color: #93c5fd;
            text-shadow: 0 0 30px rgba(147, 197, 253, 0.8), 0 0 60px rgba(147, 197, 253, 0.4);
        }

        body.light-mode .logo-container:hover .logo-text span:nth-child(1) {
            transform: translateY(-20px) rotateZ(-10deg);
            color: #0ea5e9;
            text-shadow: 0 0 30px rgba(14, 165, 233, 0.6), 0 0 60px rgba(14, 165, 233, 0.3);
        }

        body.light-mode .logo-container:hover .logo-text span:nth-child(2) {
            transform: translateY(-30px) rotateZ(5deg);
            color: #0284c7;
            text-shadow: 0 0 30px rgba(2, 132, 199, 0.6), 0 0 60px rgba(2, 132, 199, 0.3);
        }

        body.light-mode .logo-container:hover .logo-text span:nth-child(3) {
            transform: translateY(-40px) rotateZ(-5deg) scale(1.2);
            color: #0369a1;
            text-shadow: 0 0 40px rgba(3, 105, 161, 0.8), 0 0 80px rgba(3, 105, 161, 0.4);
        }

        body.light-mode .logo-container:hover .logo-text span:nth-child(4) {
            transform: translateY(-35px) rotateZ(8deg);
            color: #0284c7;
            text-shadow: 0 0 30px rgba(2, 132, 199, 0.6), 0 0 60px rgba(2, 132, 199, 0.3);
        }

        body.light-mode .logo-container:hover .logo-text span:nth-child(5) {
            transform: translateY(-25px) rotateZ(-8deg);
            color: #0ea5e9;
            text-shadow: 0 0 30px rgba(14, 165, 233, 0.6), 0 0 60px rgba(14, 165, 233, 0.3);
        }

        body.light-mode .logo-container:hover .logo-text span:nth-child(6) {
            transform: translateY(-30px) rotateZ(10deg);
            color: #38bdf8;
            text-shadow: 0 0 30px rgba(56, 189, 248, 0.6), 0 0 60px rgba(56, 189, 248, 0.3);
        }

        body.light-mode .logo-container:hover .logo-text span:nth-child(7) {
            transform: translateY(-20px) rotateZ(-12deg);
            color: #0ea5e9;
            text-shadow: 0 0 30px rgba(14, 165, 233, 0.6), 0 0 60px rgba(14, 165, 233, 0.3);
        }

        .tagline {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            font-weight: 300;
            letter-spacing: 4px;
            white-space: nowrap;
            font-family: Arial, sans-serif;
            opacity: 0;
            transition: opacity 0.6s ease 0.3s;
        }

        body.dark-mode .tagline {
            color: rgba(255, 255, 255, 0.5);
        }

        body.light-mode .tagline {
            color: rgba(30, 41, 59, 0.5);
        }

        .logo-container:hover .tagline {
            opacity: 1;
        }

        .ticker-line {
            position: absolute;
            bottom: -30px;
            left: 0;
            width: 100%;
            height: 3px;
            opacity: 0;
            transform: scaleX(0);
            transition: all 0.6s ease;
        }

        body.dark-mode .ticker-line {
            background: linear-gradient(90deg, transparent 0%, #3b82f6 30%, #60a5fa 50%, #3b82f6 70%, transparent 100%);
        }

        body.light-mode .ticker-line {
            background: linear-gradient(90deg, transparent 0%, #0ea5e9 30%, #38bdf8 50%, #0ea5e9 70%, transparent 100%);
        }

        .logo-container:hover .ticker-line {
            opacity: 1;
            transform: scaleX(1);
        }

        @media (max-width: 768px) {
            .logo-text {
                font-size: 60px;
                letter-spacing: 4px;
            }
        }
    </style>
</head>
<body class="dark-mode">
    <div class="theme-toggle" id="themeToggle">🌙</div>
    
    <div id="canvas-container"></div>
    
    <div class="content">
        <div class="logo-container">
            <div class="logo-text">
                <span>A</span><span>R</span><span>T</span><span>H</span><span>A</span><span>K</span><span>O</span>
            </div>
            <div class="ticker-line"></div>
            <div class="tagline">NEPAL'S TOP 200 COMPANIES</div>
        </div>
    </div>

    <script>
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;
        let isDark = true;

        themeToggle.addEventListener('click', () => {
            isDark = !isDark;
            if (isDark) {
                body.classList.remove('light-mode');
                body.classList.add('dark-mode');
                themeToggle.textContent = '🌙';
            } else {
                body.classList.remove('dark-mode');
                body.classList.add('light-mode');
                themeToggle.textContent = '☀️';
            }
        });

        // THREE.js fluid gradient setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Fluid shader
        const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            precision highp float;
            uniform float uTime;
            uniform vec2 uMouse;
            uniform vec2 uResolution;
            uniform float uMouseVelocity;
            uniform float uIsDark;
            varying vec2 vUv;

            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

            float snoise(vec2 v) {
                const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
                vec2 i  = floor(v + dot(v, C.yy));
                vec2 x0 = v -   i + dot(i, C.xx);
                vec2 i1;
                i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
                vec4 x12 = x0.xyxy + C.xxzz;
                x12.xy -= i1;
                i = mod289(i);
                vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
                vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
                m = m*m;
                m = m*m;
                vec3 x = 2.0 * fract(p * C.www) - 1.0;
                vec3 h = abs(x) - 0.5;
                vec3 ox = floor(x + 0.5);
                vec3 a0 = x - ox;
                m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);
                vec3 g;
                g.x  = a0.x  * x0.x  + h.x  * x0.y;
                g.yz = a0.yz * x12.xz + h.yz * x12.yw;
                return 130.0 * dot(m, g);
            }

            void main() {
                vec2 uv = vUv;
                vec2 mouseInfluence = uMouse;
                
                // Create flowing noise
                float noise1 = snoise(uv * 3.0 + uTime * 0.2);
                float noise2 = snoise(uv * 2.0 - uTime * 0.15);
                float noise3 = snoise(uv * 4.0 + uTime * 0.3);
                
                // Mouse interaction - create fluid distortion
                vec2 toMouse = uv - mouseInfluence;
                float mouseDist = length(toMouse);
                float mouseEffect = smoothstep(0.4, 0.0, mouseDist) * uMouseVelocity;
                
                // Distort UV coordinates based on mouse
                vec2 distortedUV = uv;
                distortedUV += normalize(toMouse) * mouseEffect * 0.3;
                distortedUV += vec2(noise1, noise2) * 0.05;
                
                // Create animated gradient with distortion
                float gradient1 = sin(distortedUV.x * 2.0 + uTime * 0.5 + noise1) * 0.5 + 0.5;
                float gradient2 = cos(distortedUV.y * 2.0 - uTime * 0.3 + noise2) * 0.5 + 0.5;
                float gradient3 = sin((distortedUV.x + distortedUV.y) * 1.5 + uTime * 0.4 + noise3) * 0.5 + 0.5;
                
                vec3 color;
                
                if (uIsDark > 0.5) {
                    // Dark mode - deep blues and purples
                    vec3 color1 = vec3(0.05, 0.09, 0.16); // Deep navy
                    vec3 color2 = vec3(0.09, 0.18, 0.35); // Medium blue
                    vec3 color3 = vec3(0.14, 0.31, 0.58); // Lighter blue
                    vec3 color4 = vec3(0.23, 0.51, 0.76); // Sky blue
                    
                    color = mix(color1, color2, gradient1);
                    color = mix(color, color3, gradient2);
                    color = mix(color, color4, gradient3 * 0.5);
                    
                    // Add mouse glow
                    color += vec3(0.2, 0.4, 0.9) * mouseEffect * 0.4;
                } else {
                    // Light mode - soft pastels
                    vec3 color1 = vec3(0.97, 0.98, 0.99); // Off white
                    vec3 color2 = vec3(0.88, 0.95, 0.99); // Light blue
                    vec3 color3 = vec3(0.78, 0.93, 0.99); // Sky blue
                    vec3 color4 = vec3(0.62, 0.87, 0.98); // Cyan
                    
                    color = mix(color1, color2, gradient1);
                    color = mix(color, color3, gradient2);
                    color = mix(color, color4, gradient3 * 0.4);
                    
                    // Add mouse glow
                    color += vec3(0.05, 0.65, 0.91) * mouseEffect * 0.3;
                }
                
                // Add subtle vignette
                float vignette = smoothstep(1.2, 0.3, length(uv - 0.5));
                color *= 0.7 + vignette * 0.3;
                
                gl_FragColor = vec4(color, 1.0);
            }
        `;

        const geometry = new THREE.PlaneGeometry(2, 2);
        const material = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms: {
                uTime: { value: 0 },
                uMouse: { value: new THREE.Vector2(0.5, 0.5) },
                uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                uMouseVelocity: { value: 0 },
                uIsDark: { value: 1.0 }
            }
        });

        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        // Mouse tracking
        let mouseX = 0.5;
        let mouseY = 0.5;
        let targetMouseX = 0.5;
        let targetMouseY = 0.5;
        let prevMouseX = 0.5;
        let prevMouseY = 0.5;
        let mouseVelocity = 0;

        window.addEventListener('mousemove', (e) => {
            targetMouseX = e.clientX / window.innerWidth;
            targetMouseY = 1.0 - (e.clientY / window.innerHeight);
        });

        window.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            targetMouseX = touch.clientX / window.innerWidth;
            targetMouseY = 1.0 - (touch.clientY / window.innerHeight);
        });

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            material.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            // Smooth mouse following
            mouseX += (targetMouseX - mouseX) * 0.1;
            mouseY += (targetMouseY - mouseY) * 0.1;

            // Calculate velocity
            const dx = mouseX - prevMouseX;
            const dy = mouseY - prevMouseY;
            const currentVelocity = Math.sqrt(dx * dx + dy * dy);
            mouseVelocity += (currentVelocity - mouseVelocity) * 0.1;

            prevMouseX = mouseX;
            prevMouseY = mouseY;

            // Update uniforms
            material.uniforms.uTime.value += 0.01;
            material.uniforms.uMouse.value.set(mouseX, mouseY);
            material.uniforms.uMouseVelocity.value = mouseVelocity * 20;
            material.uniforms.uIsDark.value = isDark ? 1.0 : 0.0;

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
