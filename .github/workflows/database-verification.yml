name: Database Security Verification

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  database-verification:
    runs-on: ubuntu-latest
    
    environment:
      name: security-verification
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        working-directory: ./api
        run: npm ci
      
      - name: Verify RLS Policies
        working-directory: ./api
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
        run: |
          echo "Running RLS policy verification..."
          npm run db:verify-rls
          if [ $? -ne 0 ]; then
            echo "❌ RLS policy verification failed. Blocking deployment."
            exit 1
          fi
          echo "✅ RLS policies verified successfully"
      
      - name: Test Database Queries
        working-directory: ./api
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
        run: |
          echo "Running database query tests..."
          npm run db:test-queries
          if [ $? -ne 0 ]; then
            echo "❌ Database query tests failed. Blocking deployment."
            exit 1
          fi
          echo "✅ All database query tests passed"
      
      - name: Comment PR with Results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Database verification passed - RLS policies and query tests successful'
            });
      
      - name: Upload Verification Logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: db-verification-logs
          path: api/logs/
          retention-days: 30

  lint-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        working-directory: ./api
        run: npm ci
      
      - name: Build TypeScript
        working-directory: ./api
        run: npm run build
      
      - name: Run ESLint (if configured)
        working-directory: ./api
        run: npm run lint 2>/dev/null || true
